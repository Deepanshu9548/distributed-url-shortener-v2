name: url-shortener

x-app-common: &app-common
  build:
    context: ..
    dockerfile: Dockerfile
  environment: &app-env
    SPRING_PROFILES_ACTIVE: docker
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    # Track B: real consistent-hash router + per-shard datasources.
    # JDBC URLs default to the compose hostnames in application.yml.
    SHARDING_ENABLED: "true"
  depends_on:
    shard1-primary: { condition: service_healthy }
    shard1-replica: { condition: service_healthy }
    shard2-primary: { condition: service_healthy }
    shard2-replica: { condition: service_healthy }
    control-db: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  networks: [shortener-net]
  restart: unless-stopped

x-pg-common: &pg-common
  image: postgres:16-alpine
  environment: &pg-env
    POSTGRES_DB: shortener
    POSTGRES_USER: shortener
    POSTGRES_PASSWORD: shortener
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
    interval: 5s
    timeout: 3s
    retries: 10
  networks: [shortener-net]

x-pg-replica-common: &pg-replica-common
  image: postgres:16-alpine
  user: postgres
  environment:
    <<: *pg-env
    PGPASSWORD: replicator
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
    interval: 5s
    timeout: 3s
    retries: 20
  networks: [shortener-net]

services:
  # ── App layer (stateless, 2 instances) ────────────────────────────────
  app1:
    <<: *app-common
    environment:
      <<: *app-env
      NODE_ID: "1"
  app2:
    <<: *app-common
    environment:
      <<: *app-env
      NODE_ID: "2"

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app1, app2]
    networks: [shortener-net]
    restart: unless-stopped

  # ── Shard 1: primary + streaming replica ──────────────────────────────
  shard1-primary:
    <<: *pg-common
    ports: ["5433:5432"]
    command: |
      postgres -c wal_level=replica -c max_wal_senders=4 -c hot_standby=on
    volumes:
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - shard1-primary-data:/var/lib/postgresql/data

  shard1-replica:
    <<: *pg-replica-common
    ports: ["5434:5432"]
    depends_on:
      shard1-primary: { condition: service_healthy }
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        until pg_basebackup -h shard1-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R; do sleep 2; done
        chmod 700 /var/lib/postgresql/data
      fi
      exec postgres
      "
    volumes:
      - shard1-replica-data:/var/lib/postgresql/data

  # ── Shard 2: primary + streaming replica ──────────────────────────────
  shard2-primary:
    <<: *pg-common
    ports: ["5435:5432"]
    command: |
      postgres -c wal_level=replica -c max_wal_senders=4 -c hot_standby=on
    volumes:
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - shard2-primary-data:/var/lib/postgresql/data

  shard2-replica:
    <<: *pg-replica-common
    ports: ["5436:5432"]
    depends_on:
      shard2-primary: { condition: service_healthy }
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        until pg_basebackup -h shard2-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R; do sleep 2; done
        chmod 700 /var/lib/postgresql/data
      fi
      exec postgres
      "
    volumes:
      - shard2-replica-data:/var/lib/postgresql/data

  # ── Control DB (users, refresh tokens, user_links index, analytics) ───
  control-db:
    <<: *pg-common
    ports: ["5437:5432"]
    volumes:
      - control-db-data:/var/lib/postgresql/data

  # ── Redis (cache + rate limiting + JWT denylist) ──────────────────────
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [shortener-net]

  # ── Kafka (KRaft, single node) ────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [shortener-net]

  # ── Observability ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [shortener-net]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [shortener-net]

networks:
  shortener-net:

volumes:
  shard1-primary-data:
  shard1-replica-data:
  shard2-primary-data:
  shard2-replica-data:
  control-db-data:
