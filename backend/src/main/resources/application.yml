spring:
  application:
    name: url-shortener
  profiles:
    default: local
  flyway:
    enabled: false # migrations run programmatically per shard (ShardDataSourceConfig) and per control DB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta.persistence.query.timeout: 1000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 0

server:
  port: 8080
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,200ms,500ms,1s

app:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  node-id: ${NODE_ID:1}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  snowflake:
    epoch: 2024-01-01T00:00:00Z
  # Track C (ADR-010): control DB is off the ring. Compose sets a Postgres
  # URL; host-side runs point to localhost or an H2 mem URL.
  control-db:
    jdbc-url: ${CONTROL_DB_URL:jdbc:postgresql://control-db:5432/control}
    username: ${CONTROL_DB_USER:control}
    password: ${CONTROL_DB_PASSWORD:control}
    pool-size: ${CONTROL_DB_POOL_SIZE:10}
  # Track C (ADR-009): JWT settings. Secret from env — leave the default
  # empty so context startup fails only when someone actually needs auth
  # (SecurityConfig is @ConditionalOnProperty("app.jwt.secret") — an unset
  # secret disables the whole auth stack, useful for load-test profiles).
  jwt:
    secret: ${JWT_SECRET:#{null}}
    access-ttl: PT15M
    refresh-ttl: P7D
    issuer: url-shortener
  # Track B (ADR-002): consistent-hash sharding. Disabled locally (the
  # SingleShardRouter stub serves); compose/CI enable via SHARDING_ENABLED=true.
  # JDBC defaults use the compose network hostnames; host-side runs override
  # via env (compose maps ports 5433/5434 shard1, 5435/5436 shard2).
  sharding:
    enabled: ${SHARDING_ENABLED:false}
    vnodes: 150
    shards:
      - name: shard1
        primary:
          jdbc-url: ${SHARD1_PRIMARY_URL:jdbc:postgresql://shard1-primary:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}
        replica:
          jdbc-url: ${SHARD1_REPLICA_URL:jdbc:postgresql://shard1-replica:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}
      - name: shard2
        primary:
          jdbc-url: ${SHARD2_PRIMARY_URL:jdbc:postgresql://shard2-primary:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}
        replica:
          jdbc-url: ${SHARD2_REPLICA_URL:jdbc:postgresql://shard2-replica:5432/shortener}
          username: ${SHARD_DB_USER:shortener}
          password: ${SHARD_DB_PASSWORD:shortener}
          pool-size: ${SHARD_POOL_SIZE:10}

ratelimit:
  enabled: true
  limiters:
    write:    { capacity: 10,  refill-per-minute: 10,  fail-open: false }
    redirect: { capacity: 100, refill-per-minute: 100, fail-open: true }
    auth:     { capacity: 5,   refill-per-minute: 5,   fail-open: false }

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      redis-cache:
        baseConfig: default
      redis-ratelimit:
        baseConfig: default
      kafka-publisher:
        baseConfig: default
        waitDurationInOpenState: 10s
      shard-shard1:
        baseConfig: default
      shard-shard2:
        baseConfig: default
